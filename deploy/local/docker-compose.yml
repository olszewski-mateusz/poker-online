name: 'poker'
services:
  redis:
    image: 'redis:latest'
    container_name: 'poker-redis'
    ports:
      - '6379:6379'
    networks:
      - 'poker-network'
  server:
    image: 'io.olszewski.demo.poker/server:latest'
    container_name: 'poker-server'
    env_file: './config/server.env'
    depends_on:
      - 'redis'
      - 'ai-server'
    ports:
      - '8080:8080'
    networks:
      - 'poker-network'
  ai-server:
    image: 'io.olszewski.demo.poker/ai-server:latest'
    container_name: 'poker-ai-server'
    environment:
      POKER_SERVER_URL: 'http://poker-server:8080'
    ports:
      - '8081:8081'
    networks:
      - 'poker-network'
  app:
    image: 'io.olszewski.demo.poker/app:latest'
    container_name: 'poker-app'
    ports:
      - '4200:80'
    networks:
      - 'poker-network'
networks:
  poker-network:
    driver: bridge
