<poker-game-toolbar [game]="game()" [mobile]="false"/>

<div class="main-container">
  <poker-game-history class="left-column" [game]="game()" [mobile]="false"/>

  <div class="middle-column">
    <poker-game-state [game]="game()" [mobile]="false"/>
    <poker-game-hand-better [game]="game()" [mobile]="false"/>
  </div>

  <div class="right-column">
    <poker-game-players-carousel
      [game]="this.game()"
      [vertical]="true"
      [highlightedOnCenter]="false"
    />
  </div>

</div>

<poker-game-actions [game]="game()" [mobile]="false"/>
