@if (selectedAmountAction(); as action) {
  <poker-game-chips-amount-setter
    [game]="game()"
    [mobile]="mobile()"
    [action]="action"
    (cancelRequest)="closeAmountPanel()"
  />
} @else {
  @for (action of availableActions(); track action.type) {
    <button class="button-large" mat-button (click)="onActionClick(action)">
      {{actionButtonLabel(action)}}
    </button>
  }
}
