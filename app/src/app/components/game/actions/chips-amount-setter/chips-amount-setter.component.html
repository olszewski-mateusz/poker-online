@if (!actionIllegal()) {
  <div class="row-container amount-label poker-text"
       [class.mobile]="mobile()"
       [class.desktop]="!mobile()">
    <span>{{context().label}}: {{amount()}}</span>
    <mat-icon inline>poker_chip</mat-icon>
  </div>

  @if (mobile()) {
    <div class="row-container">
      <mat-slider [step]="5" [min]="context().minValue" [max]="context().maxValue">
        <input [(value)]="amount" matSliderThumb (input)="sliderAmount.set($any($event.target).valueAsNumber)">
      </mat-slider>
    </div>

    <div class="row-container margin-bottom">
      <button class="button-medium" mat-button (click)="addToAmount(-10)">-10</button>
      <button class="button-medium" mat-button (click)="addToAmount(-1)">-1</button>
      <button class="button-medium" mat-button (click)="addToAmount(1)">+1</button>
      <button class="button-medium" mat-button (click)="addToAmount(10)">+10</button>
    </div>
  } @else {
    <div class="row-container">
      <button class="button-large" mat-button (click)="addToAmount(-10)">-10</button>
      <button class="button-large" mat-button (click)="addToAmount(-1)">-1</button>

      <mat-slider [step]="5" [min]="context().minValue" [max]="context().maxValue">
        <input [(value)]="amount" matSliderThumb (input)="sliderAmount.set($any($event.target).valueAsNumber)">
      </mat-slider>

      <button class="button-large" mat-button (click)="addToAmount(1)">+1</button>
      <button class="button-large" mat-button (click)="addToAmount(10)">+10</button>
    </div>
  }
}

<div class="row-container">
  <button mat-button
          [class.button-large]="!mobile()"
          [class.button-medium]="mobile()"
          [disabled]="actionIllegal()" (click)="sendAction()">
    Confirm
  </button>

  <button mat-button
          [class.button-large]="!mobile()"
          [class.button-medium]="mobile()"
          (click)="cancelRequest.emit()">
    Cancel
  </button>
</div>
