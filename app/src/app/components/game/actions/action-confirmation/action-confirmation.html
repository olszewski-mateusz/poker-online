<div class="title poker-text">{{context().title}}</div>
<div class="actions">
  <button mat-button
          [class.button-large]="!mobile()"
          [class.button-medium]="mobile()"
          (click)="sendAction()">
    Confirm
  </button>

  <button mat-button
          [class.button-large]="!mobile()"
          [class.button-medium]="mobile()"
          (click)="cancelRequest.emit()">
    Cancel
  </button>
</div>
