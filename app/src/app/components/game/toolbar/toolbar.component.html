<mat-toolbar
  [class.mobile]="mobile()"
  [class.desktop]="!mobile()"
>
  @if (myPlayer(); as myPlayer) {
      <div class="start">
        <div>
          <mat-icon inline>account_circle</mat-icon>
          <span>{{myPlayer.name}}</span>
        </div>

        @if (!mobile()) {
          <div>
            <mat-icon inline>money_bag</mat-icon>
            <span>{{myPlayer.chips}}</span>
          </div>

          <div>
            <mat-icon inline>poker_chip</mat-icon>
            <span>{{myPlayer.bet}}</span>
          </div>
        }
      </div>

      @if (mobile()) {
        <div class="middle">
          <div>
            <mat-icon inline>playing_cards</mat-icon>
            <span>{{game().gameId}}</span>
          </div>
        </div>
      } @else {
        <div class="middle">
            Game ID: {{game().gameId}}
        </div>
      }

      <div class="end">
        @if (adminAccess()) {
          <button mat-button [matMenuTriggerFor]="menu">
            <mat-icon>settings</mat-icon>
            <span>Admin</span>
          </button>
        }
        @if (mobile()) {
          <button mat-icon-button (click)="leave()">
            <mat-icon>logout</mat-icon>
          </button>
        } @else {
          <button mat-button (click)="leave()">
            <mat-icon>logout</mat-icon>
            <span>Leave</span>
          </button>
        }
      </div>

    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="addAiPlayer()">
        <mat-icon>add</mat-icon>
        <span>Add AI player</span>
      </button>
      <button mat-menu-item>
        <mat-icon>close</mat-icon>
        <span>Remove player</span>
      </button>
      <button mat-menu-item>
        <mat-icon>replay</mat-icon>
        <span>Reset game</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
