<div class="viewport poker-panel"
     [class.is-dragging]="isDragging()"
     [class.animate-snap]="isSnapping() && !isDragging()"
     [style.--item-height.px]="itemHeightPx"
     (pointerdown)="onPointerDown($event)"
     (pointermove)="onPointerMove($event)"
     (pointerup)="onPointerCancel($event)"
     (pointercancel)="onPointerCancel($event)">
  @for (offset of renderedSlots; track offset) {
    <div class="slot"
         [class.highlighted]="highlighted(offset)"
         [style.transform]="slotTransform(offset)">
      <div class="player-name">{{ playerNameForOffset(offset) }}</div>
    </div>
  }
</div>
