<div class="viewport poker-panel"
     [class.is-dragging]="isDragging()"
     [class.animate-snap]="animateSnap() && !isDragging()"
     [class.highlighted-center]="highlightedOnCenter()"
     [class.highlighted-start]="!highlightedOnCenter()"
     [class.vertical]="vertical()"
     [class.horizontal]="!vertical()"
     [style.--item-height.px]="itemSideSize"
     [style.--item-count]="players().length"
     (pointerdown)="onPointerDown($event)"
     (pointermove)="onPointerMove($event)"
     (pointerup)="onPointerCancel($event)"
     (pointercancel)="onPointerCancel($event)">
  @for (offset of renderedSlots; track offset) {
    @if (getPlayerForOffset(offset); as player) {
      <div class="slot" [style.transform]="slotTransform(offset)">
        <poker-game-players-carousel-properties
          [game]="game()"
          [player]="player"
          [highlighted]="highlighted(offset)"
          [vertical]="vertical()"/>
      </div>
    }
  }
</div>
