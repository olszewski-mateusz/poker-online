<div class="poker-panel"
     [class.mobile]="mobile()"
     [class.desktop]="!mobile()">

  <div class="phase poker-text-light">
    {{translatedGamePhase()}}
  </div>

  <div class="property">
    <span>Pot: </span>
    <strong>{{potReward()}}</strong>
    <mat-icon inline>poker_chip</mat-icon>
  </div>

  <button class="button-medium" mat-button>Showdown details</button>
</div>
