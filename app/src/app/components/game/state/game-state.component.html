<div class="poker-panel"
     [class.mobile]="mobile()"
     [class.desktop]="!mobile()">

  <div class="phase poker-text-light">
    {{translatedGamePhase()}}
  </div>

  <div class="pot">
    <div class="pot-border">
      <span>Pot: </span>
      <strong>{{animatedPotReward()}}</strong>
      <mat-icon inline>poker_chip</mat-icon>
    </div>
    <button class="pot-info" mat-icon-button>
      <mat-icon class="poker-text">info</mat-icon>
    </button>
  </div>


  @if (game().phase === "SHOWDOWN") {
    <button class="button-medium showdown-button" mat-button>Showdown details</button>
  }
</div>
